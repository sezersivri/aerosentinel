# AeroSentinel Scout — Runs weekly on Saturday
# Hunts for papers -> Summarizes (bilingual) -> Sends Telegram preview

name: "AeroSentinel Scout"

on:
  schedule:
    # Every Saturday at 08:00 UTC (11:00 Turkey time)
    - cron: "0 8 * * 6"

  # Manual trigger for testing
  workflow_dispatch:

  # Telegram /scout command trigger
  repository_dispatch:
    types: [telegram_scout]

concurrency:
  group: "aerosentinel-pipeline"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Scout Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
        run: python -m src.pipeline

      - name: Commit draft and history
        run: |
          git config user.name "AeroSentinel Bot"
          git config user.email "aerosentinel@proton.me"
          git add seen_papers.json content/drafts/ usage_stats.json data/ || true
          git diff --cached --quiet || git commit -m "Scout: new draft $(date +%Y-%m-%d)"
          git push
