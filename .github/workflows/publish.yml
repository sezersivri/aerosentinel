# AeroSentinel Publisher — Triggered by Telegram approval via Google Apps Script
# Moves draft to posts -> Rebuilds Hugo site -> Sends confirmation

name: "AeroSentinel Publish"

on:
  repository_dispatch:
    types: [telegram_command]

concurrency:
  group: "aerosentinel-pipeline"
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.client_payload.command == 'publish'
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Publish draft
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          python -m src.pipeline --publish "$FILENAME"

      - name: Commit published post
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          git config user.name "AeroSentinel Bot"
          git config user.email "aerosentinel@proton.me"
          git add content/posts/ content/drafts/ || true
          git diff --cached --quiet || git commit -m "Published: $FILENAME"
          git push

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@75d2e84710de30f6ff7268e08f310b60ef14033f  # v3
        with:
          hugo-version: "latest"
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  discard:
    runs-on: ubuntu-latest
    if: github.event.client_payload.command == 'discard'
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          submodules: true

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Discard draft
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          python -m src.pipeline --discard "$FILENAME"

      - name: Commit removal
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          git config user.name "AeroSentinel Bot"
          git config user.email "aerosentinel@proton.me"
          git add content/drafts/ || true
          git diff --cached --quiet || git commit -m "Discarded: $FILENAME"
          git push
