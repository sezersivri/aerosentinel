baseURL: "https://sezersivri.github.io/aerosentinel/"
theme: "PaperMod"

# Multilingual
defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    title: "AeroSentinel"
    params:
      description: "Automated Research Intelligence for Aerospace & Hypersonic Aerothermodynamics"
      homeInfoParams:
        Title: "AeroSentinel"
        Content: >
          AI-powered research intelligence on hypersonic aerodynamics,
          aerothermodynamics, missile heating, and ML/AI surrogates for CFD.
          Updated weekly. Quality-filtered from AIAA, JFM, Physics of Fluids,
          NASA NTRS, Crossref, CORE, and other top-tier sources.
    menu:
      main:
        - identifier: home
          name: Home
          url: /
          weight: 1
        - identifier: tags
          name: Topics
          url: /tags/
          weight: 2
        - identifier: archive
          name: Archive
          url: /archives/
          weight: 3
        - identifier: about
          name: About
          url: /about/
          weight: 4

  tr:
    languageName: "Turkce"
    weight: 2
    title: "AeroSentinel"
    params:
      description: "Havaclik ve Hipersonik Aerotermodinamik icin Otomatik Arastirma Istihbarati"
      homeInfoParams:
        Title: "AeroSentinel"
        Content: >
          Hipersonik aerodinamik, aerotermodinamik, fuze isinmasi ve
          CFD icin yapay zeka/makine ogrenmesi vekil modelleri hakkinda
          yapay zeka destekli arastirma istihbarati.
          Haftalik guncellenir. AIAA, JFM, Physics of Fluids,
          NASA NTRS, Crossref, CORE ve diger ust duzey kaynaklardan
          kalite filtrelidir.
    menu:
      main:
        - identifier: home
          name: Ana Sayfa
          url: /tr/
          weight: 1
        - identifier: tags
          name: Konular
          url: /tr/tags/
          weight: 2
        - identifier: archive
          name: Arsiv
          url: /tr/archives/
          weight: 3
        - identifier: about
          name: Hakkinda
          url: /tr/about/
          weight: 4

# Build settings
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false

# No tracking, no analytics — privacy first
privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true
  x:
    disable: true
  youtube:
    disable: true

params:
  env: production
  author: "AeroSentinel"

  # PaperMod specific
  defaultTheme: "auto"
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true

  socialIcons:
    - name: github
      url: "https://github.com/sezersivri/aerosentinel"

  # SEO
  keywords:
    - aerodynamic heating
    - hypersonic aerodynamics
    - missile aerodynamics
    - reentry vehicle
    - CFD
    - aerothermodynamics
    - machine learning aerodynamics
    - surrogate model
    - Gaussian process

# Taxonomy
taxonomies:
  tag: tags

# Output formats
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true  # Allow raw HTML (<details>, collapsible sections)
  highlight:
    noClasses: false
